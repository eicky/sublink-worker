<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Sublink Worker</title>
  <desc id="desc">A subscription link branching into multiple client configurations</desc>
